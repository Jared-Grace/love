<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🙏</text></svg>">

  <style>@keyframes html_loading_spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
@keyframes html_loading_glow {
  0% { box-shadow: 0 0 0.75rem #8cb4ff66; }
  50% { box-shadow: 0 0 2rem #8cb4ffe6; }
  100% { box-shadow: 0 0 0.75rem #8cb4ff66; }
}
@keyframes html_loading_spin_reverse {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(-360deg); }
}
@keyframes html_loading_breath {
  0% { transform: scale(1.206449647145354); }
  12.5% { transform: scale(0.8462372383242107); }
  25% { transform: scale(1.1474268214283985); }
  37.5% { transform: scale(0.9347319379783449); }
  50% { transform: scale(1.2782144839446965); }
  62.5% { transform: scale(0.880194466272522); }
  75% { transform: scale(1.2763542011588556); }
  87.5% { transform: scale(0.9529198836396904); }
  100% { transform: scale(1.206449647145354); }
}
@keyframes html_loading_core {
  0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.85; }
  50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.85; }
}</style><div id="app-loading" style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0, 0, 0, 0.8);z-index:1000"><div style="position:fixed;top:50%;left:50%;width:16rem;height:16rem;transform:translate(-50%,-50%)"><div style="position:absolute;inset:0;animation:html_loading_breath 8s ease-in-out infinite"><div style="position:absolute;inset:0;border:1rem solid #8cb4ff33;border-top-color:#bcd6ff;border-radius:50%;box-shadow:0 0 1rem #8cb4ff99;animation:html_loading_spin 2s ease-in-out infinite, html_loading_glow 2s ease-in-out infinite"></div></div><div style="position:absolute;inset:4rem;border:0.6rem solid #8cb4ff26;border-bottom-color:#bcd6ff;border-radius:50%;animation:html_loading_spin_reverse 1.4s linear infinite"></div><div style="position:absolute;top:50%;left:50%;width:2.8rem;height:2.8rem;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#bcd6ff 0%,#4a90e2 70%);box-shadow:0 0 1rem #8cb4ffe6;animation:html_loading_core 2s ease-in-out infinite"></div></div><p style="position:fixed;top:calc(50% + 11rem);left:50%;transform:translateX(-50%);margin:0;color:white;font-size:1.5rem;font-family:sans-serif;text-align:center;text-shadow:0 0.05em 0.15em rgba(0, 0, 0, 0.8);background:radial-gradient(ellipse at center, rgba(0, 0, 0, 0.55) 0%, rgba(0, 0, 0, 0) 75%);padding:1.25rem 3.5rem">One moment, please 🙏</p></div>
