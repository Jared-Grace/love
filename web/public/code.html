  <script>if (location.pathname.indexOf('/dev/') !== -1) { var dev_error_show = function (kind, message) { var box = document.getElementById('dev-error-banner'); if (!box) { box = document.createElement('pre'); box.id = 'dev-error-banner'; box.setAttribute('style', 'position:fixed;left:0;right:0;bottom:0;max-height:60vh;overflow:auto;margin:0;padding:1rem;z-index:2147483647;background:#ffdddd;color:#900;font:0.9rem monospace;white-space:pre-wrap;border-top:0.25rem solid #900'); document.body.appendChild(box); } box.textContent = box.textContent + kind + ': ' + message + '\n'; }; window.addEventListener('error', function (e) { dev_error_show('error', (e.message || e.error) + ' @ ' + e.filename + ':' + e.lineno); }); window.addEventListener('unhandledrejection', function (e) { var reason = e.reason; dev_error_show('unhandled', (reason && reason.stack) || reason); }); }</script>
