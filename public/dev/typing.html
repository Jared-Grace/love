<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>typing</title>
</head>
<body style="font: 1rem system-ui; padding: 1rem">
<!--
  A page with one writing box and nothing else, kept by hand rather than
  generated, so that a phone that cannot type into an app has somewhere to try
  the same thing with none of that app on the page. If the letters land here,
  the fault is ours and can be looked for in our own code; if they do not, no
  amount of reading our code will find it, because none of it is running.

  It watches itself the same way every other dev page can, so the run is written
  down here rather than read aloud off a small screen.

  DO NOT FOLD THIS INTO AN APP, however tidy that would be. Its whole worth is
  the sentence above: none of our code is running, so a failure here cannot be
  ours. Put it inside the sandbox and that reading is gone, and what is left is
  two readings that are really one.

  Its other half is the sandbox app at #typing_box, which is the same box with
  our shell, our boot and our styling around it. Read as a pair they divide the
  fault in one move: letters landing in neither means the phone or the browser;
  letters landing here and not there means the fault is ours, and is in what
  that page has and this one has not.
-->
<p>Tap the box and type. Whatever you type should appear twice: once in the box, once under it.</p>
<input id="box" placeholder="type here" style="font: 1.2rem system-ui; padding: 0.6rem; width: 100%; box-sizing: border-box">
<p>The box now holds: <b id="echo">nothing</b></p>
<script>
  var box = document.getElementById("box");
  var echo = document.getElementById("echo");
  setInterval(function () { echo.textContent = box.value === "" ? "nothing" : box.value; }, 200);
</script>
<script src="recorder.js?v=typing"></script>
</body>
</html>
